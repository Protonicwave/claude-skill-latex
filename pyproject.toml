[project]
name = "claude-skill-latex"
version = "0.1.0"
description = "A Claude Code skill for typesetting LaTeX documents."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
    "vulture==2.14",
]
# Only the scripts in research/ need these; the skill's own scripts use the standard library.
research = [
    "matplotlib==3.11.2",
    "numpy==2.5.1",
]

[tool.uv]
package = false
default-groups = ["dev", "research"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, and test tables use literal values.
"tests/**" = ["S101", "PLR2004"]
# The scripts run TeX tools from argument lists, never through a shell.
"skills/latex/scripts/**" = ["S603"]

[tool.mypy]
strict = true
files = ["research", "skills", "tests"]
mypy_path = "skills/latex/scripts"

[tool.vulture]
# pytest finds its hooks in conftest.py by name, so nothing in the code calls them.
ignore_names = ["pytest_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/latex/scripts"]
markers = ["tex: runs the TeX distribution, so needs latexmk and poppler on PATH"]
